# Every key has a default; they are spelled out here because this file is
# also the reference for what a host application may tune.
forum:
    topics_per_page: 20
    posts_per_page: 10
    # Zero seconds between two posts: a demonstrator that makes you wait
    # fifteen seconds to see a second reply is a bad demonstrator.
    flood_interval: 0
    hot_threshold: 25
    moderator_role: ROLE_ADMIN
