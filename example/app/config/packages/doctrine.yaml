doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        # Base ships its own naming strategy and metadata factory: they resolve
        # the App\ <-> Base\ mirrored entities and the Set/Enum column types.
        naming_strategy: Base\Database\Mapping\NamingStrategy
        class_metadata_factory_name: Base\Database\Mapping\ClassMetadataFactory
        # auto_mapping picks up both bundles' entities: Base\Entity\* from
        # base-bundle and Base\Forum\Entity\* from this one (the mapping is
        # derived from the bundle class's own directory, so src/Entity needs
        # no declaration of its own).
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
